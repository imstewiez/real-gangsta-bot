name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate || true
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test with coverage (enforces thresholds via .c8rc.json)
        run: npm run test:coverage
        env:
          DATABASE_URL: ''
          DISCORD_BOT_TOKEN: 'test'
          DISCORD_GUILD_ID: 'test'
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: bot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate || true
      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://bot:bot@localhost:5432/bot_ci
          DB_SSL_MODE: off
          DISCORD_BOT_TOKEN: 'test'
          DISCORD_GUILD_ID: 'test'
      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://bot:bot@localhost:5432/bot_ci
          DB_SSL_MODE: off
          DISCORD_BOT_TOKEN: 'test'
          DISCORD_GUILD_ID: 'test'
