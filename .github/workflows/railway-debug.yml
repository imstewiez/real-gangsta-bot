name: Railway Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - run: railway status --json
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - run: railway logs --lines 50 --json
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
