name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL_MODE: require
        run: npm run db:migrate

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli
          railway up --service bot-di-zona
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Smoke test
        run: |
          echo "Waiting for deploy..."
          sleep 30
          for i in {1..20}; do
            HEALTH=$(curl -sf https://${{ secrets.RAILWAY_URL }}/ready && echo "OK" || echo "FAIL")
            if [ "$HEALTH" = "OK" ]; then
              echo "Smoke test passed!"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test FAILED"
          exit 1
