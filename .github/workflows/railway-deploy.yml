name: Railway Force Deploy (from source)

on:
  workflow_dispatch:

env:
  RAILWAY_SERVICE: bot-di-zona

jobs:
  deploy:
    name: Force Redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Railway CLI
        run: npm install -g @railway/cli

      - name: Cancel stuck deployments
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Listing non-SUCCESS deployments..."
          railway deployment list --service "$RAILWAY_SERVICE" --json > deployments.json || true
          cat deployments.json || echo "No deployments list available"

          IDS=$(cat deployments.json 2>/dev/null | jq -r '[.[] | select(.status != "SUCCESS") | .id] | .[]' 2>/dev/null || true)
          if [ -z "$IDS" ]; then
            echo "No stuck deployments to cancel."
            exit 0
          fi
          for id in $IDS; do
            echo "Cancelling deployment $id"
            # Railway CLI doesn't have a direct cancel, but we can try to remove via API
            curl -s -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"mutation { deploymentRemove(id: \\\"$id\\\") }\"}" || true
            echo ""
          done

      - name: Force redeploy from source
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Triggering redeploy from source..."
          railway redeploy --service "$RAILWAY_SERVICE" --yes --from-source

      - name: Watch deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Waiting for deployment to reach SUCCESS..."
          for i in {1..60}; do
            railway deployment list --service "$RAILWAY_SERVICE" --json > status.json 2>/dev/null || true
            cat status.json 2>/dev/null || echo "No status available"
            
            STATUS=$(cat status.json 2>/dev/null | jq -r '.[0].status // "UNKNOWN"' 2>/dev/null || echo "UNKNOWN")
            STOPPED=$(cat status.json 2>/dev/null | jq -r '.[0].deploymentStopped // false' 2>/dev/null || echo "false")
            echo "Iteration $i: status=$STATUS, stopped=$STOPPED"
            
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "Deployment reached SUCCESS!"
              exit 0
            fi
            if [ "$STOPPED" = "true" ]; then
              echo "Deployment was stopped! Check Railway dashboard."
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for deployment to succeed."
          exit 1
