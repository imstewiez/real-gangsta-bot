name: Railway Force Deploy

on:
  workflow_dispatch:

env:
  RAILWAY_SERVICE: bot-di-zona

jobs:
  deploy:
    name: Force Redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy via railway up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying via railway up..."
          railway up --service "$RAILWAY_SERVICE" --detach

      - name: Wait and fetch build logs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Waiting 60s for build to start..."
          sleep 60
          echo "=== Build logs (latest deployment) ==="
          railway logs --service "$RAILWAY_SERVICE" --build --lines 200 --latest || true

      - name: Watch deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Watching deployment..."
          for i in {1..80}; do
            railway deployment list --service "$RAILWAY_SERVICE" --json > status.json 2>/dev/null || true
            STATUS=$(cat status.json 2>/dev/null | jq -r '.[0].status // "UNKNOWN"' 2>/dev/null || echo "UNKNOWN")
            STOPPED=$(cat status.json 2>/dev/null | jq -r '.[0].deploymentStopped // false' 2>/dev/null || echo "false")
            echo "Iteration $i: status=$STATUS, stopped=$STOPPED"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "Deployment reached SUCCESS!"
              exit 0
            fi
            if [ "$STOPPED" = "true" ]; then
              echo "Deployment was stopped!"
              railway logs --service "$RAILWAY_SERVICE" --build --lines 200 --latest || true
              exit 1
            fi
            if [ "$STATUS" = "FAILED" ]; then
              echo "Deployment FAILED!"
              railway logs --service "$RAILWAY_SERVICE" --build --lines 200 --latest || true
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for deployment. Fetching latest logs..."
          railway logs --service "$RAILWAY_SERVICE" --build --lines 200 --latest || true
          exit 1
