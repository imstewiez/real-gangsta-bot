name: Apply DB Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Get DATABASE_URL
        id: db_url
        run: |
          URL=$(railway variables --json --service bot-di-zona | jq -r '.DATABASE_URL')
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Apply migrations
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=$(echo "${{ steps.db_url.outputs.url }}" | sed -n 's/.*:\/\/[^:]*:\([^@]*\)@.*/\1/p') \
            psql "${{ steps.db_url.outputs.url }}" -f migrations/088_pvp_rating_and_countdowns.sql
          PGPASSWORD=$(echo "${{ steps.db_url.outputs.url }}" | sed -n 's/.*:\/\/[^:]*:\([^@]*\)@.*/\1/p') \
            psql "${{ steps.db_url.outputs.url }}" -f migrations/089_saidas_refactor_v3.sql
